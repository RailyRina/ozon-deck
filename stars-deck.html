<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rating, deck version</title>
<style>
  :root{ --on:#13E764; --off:#B2B2B2; --stage:#141414 }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--stage);display:flex;align-items:center;justify-content:center;
       font-family:'PP Neue Montreal','Inter',system-ui,sans-serif;color:#fff;overflow:hidden}

  /* sized to the card it lives in (383x335), no scaling: the stars are big and dead centre */
  .stage{position:relative;width:383px;height:335px;user-select:none}

  .rating{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
          display:flex;justify-content:center;gap:10.5px}
  .star{width:40.5px;height:39px;border:0;padding:0;background:none;cursor:pointer;display:block;
        transform-origin:50% 60%}
  .star svg{width:100%;height:100%;display:block;overflow:visible}

  .shape{fill:var(--off);stroke:var(--off);stroke-width:4.04344;stroke-linejoin:round;
         transition:fill .55s ease,stroke .55s ease,filter .9s ease}
  .star.on .shape{fill:var(--on);stroke:var(--on)}
  /* the burst of eight sparks from the original rating, replayed on every star the wave fills */
  .rays{opacity:0;transform-origin:22.3px 22px;pointer-events:none}
  .rays line{stroke:var(--on);stroke-width:3.3;stroke-linecap:round}
  .star.pop .rays{animation:burst .8s ease-out}
  @keyframes burst{0%{opacity:0;transform:scale(.4)}25%{opacity:1}100%{opacity:0;transform:scale(1.12)}}
  .rating:not(.locked) .star.pre .shape{fill:#5c6a60;stroke:#5c6a60}

  /* a soft wave that runs along the row: lift, overshoot a little, settle */
  .star.wave{animation:wave .95s cubic-bezier(.4,0,.2,1)}
  @keyframes wave{
    0%  {transform:translateY(0) scale(1)}
    30% {transform:translateY(-10px) scale(1.16)}
    66% {transform:translateY(2px) scale(.97)}
    100%{transform:translateY(0) scale(1)}
  }
  /* before the first rating the row breathes in a slow wave to invite a tap */
  .stage:not(.rated) .star{animation:idle 4.6s ease-in-out infinite}
  @keyframes idle{0%,30%,100%{transform:translateY(0)}12%{transform:translateY(-5px)}}

  .reset{position:absolute;left:50%;top:calc(50% + 50px);transform:translateX(-50%);
         background:none;border:1px solid #3a3a3a;border-radius:20px;color:#8a8a8a;
         font:inherit;font-size:13px;padding:7px 18px;cursor:pointer;
         opacity:0;pointer-events:none;transition:opacity .4s,border-color .2s,color .2s}
  .stage.rated .reset{opacity:1;pointer-events:auto}
  .reset:hover{border-color:#5c5c5c;color:#c4c4c4}
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="rating" id="rating"></div>
  <button class="reset" id="reset">&#8634; Reset</button>
</div>

<script>
  /* same star geometry as rating-stars.html, but the viewBox is trimmed to the shape
     so the star itself (not an empty 64px tile) fills the size it is given */
  const SHAPE = 'M15.9211 15.8311L22.239 2.02148L28.5568 15.8311L42.4562 17.0865L32.3476 27.1299'
              + 'L34.8747 40.9396L22.239 34.6625L9.60322 40.9396L12.1304 27.1299L2.02178 17.0865Z';

  const CX = 22.3, CY = 22;
  const RAYS = [0,45,90,135,180,225,270,315].map(deg => {
    const a = deg * Math.PI / 180, c = Math.cos(a), sn = Math.sin(a);
    return `<line x1="${(CX+29*c).toFixed(2)}" y1="${(CY+29*sn).toFixed(2)}" x2="${(CX+35*c).toFixed(2)}" y2="${(CY+35*sn).toFixed(2)}"/>`;
  }).join('');

  const rating = document.getElementById('rating');
  const stage  = document.getElementById('stage');
  rating.innerHTML = [1,2,3,4,5].map(n =>
    `<button class="star" data-n="${n}" aria-label="${n} of 5" style="animation-delay:${(n-1)*0.14}s">
       <svg viewBox="0 0 44.5 43"><g class="rays">${RAYS}</g><path class="shape" d="${SHAPE}"/></svg>
     </button>`).join('');

  const stars = [...rating.querySelectorAll('.star')];
  const timers = [];
  let score = 0;
  const clear = () => { timers.forEach(clearTimeout); timers.length = 0; };
  const later = (fn, ms) => timers.push(setTimeout(fn, ms));
  const replay = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };

  function rate(n){
    clear();
    stage.classList.add('rated');
    stars.forEach(s => { s.classList.remove('pre'); s.style.animationDelay = '0s'; });

    if (n < score){                                    // lowering: the extra stars fade out from the end
      for (let i = score - 1; i >= n; i--){
        later(() => stars[i].classList.remove('on'), (score - 1 - i) * 90);
      }
      for (let i = 0; i < n; i++) later(() => replay(stars[i], 'wave'), i * 70);
      score = n; return;
    }
    // raising: one wave runs along the row up to the chosen star, filling the new ones as it passes
    const from = score;
    for (let i = 0; i < n; i++){
      later(() => {
        if (i >= from){
          stars[i].classList.add('on');
          replay(stars[i], 'pop');
        }
        replay(stars[i], 'wave');
      }, i * 95);
    }
    score = n;
  }

  function reset(){
    clear();
    stars.forEach((s, i) => { s.classList.remove('on','pop','wave','pre'); s.style.animationDelay = (i * 0.14) + 's'; });
    score = 0;
    stage.classList.remove('rated');
  }
  document.getElementById('reset').addEventListener('click', reset);

  stars.forEach((s, i) => {
    s.addEventListener('click', () => rate(i + 1));
    s.addEventListener('mouseenter', () => {
      stars.forEach((o, j) => o.classList.toggle('pre', j <= i && !o.classList.contains('on')));
    });
  });
  rating.addEventListener('mouseleave', () => stars.forEach(s => s.classList.remove('pre')));
</script>
</body>
</html>
